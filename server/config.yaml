ollama:
  url: "http://localhost:11434"
  translate_model: "qwen3:14b"
  translate_options:
    temperature: 0.3
    num_predict: 1024
    think: false

fonts:
  jp: "fonts/genei_antique/GenEiAntiquePv5-M.ttf"
  jp_bold: "fonts/genei_antique/GenEiAntiquePv5-M.ttf"
  en: "fonts/ComicNeue-Regular.otf"
  en_bold: "fonts/ComicNeue-Bold.otf"
  sfx: "fonts/ComicNeue-Bold.otf"

ocr:
  device: "cuda"   # "cuda" for GPU (~350MB); "cpu" if VRAM is tight
  hayai:
    # Distribution is blocked pending auditable Hayai training-data provenance.
    enabled: false
    device: "auto"  # Uses CUDA/ROCm when available, otherwise CPU
    timeout_seconds: 45
    short_text_limit: 15

text_detection:
  confidence: 0.3         # EasyOCR confidence threshold
  gpu: true

manga_inpainting:
  enabled: false          # Off by default
  pad: 20                 # Padding around text region for inpainting

book:
  # Furigana on a prose page is small by necessity — the gutter it goes in is
  # one glyph wide. Raise the scale to supersample the page for sharper kana
  # under the reader's magnifier, at four times the pixels per page.
  render_scale: 1.0
  glyphs_per_chunk: 12

webtoon:
  data_dir: "webtoon_data"
  output_dir: "output/webtoon"
  scraper:
    scroll_pause: 0.5
    download_timeout: 30
  easyocr:
    gpu: true
    confidence_threshold: 0.25
    text_threshold: 0.5
    low_text: 0.3
    inverted_confidence: 0.10
  bubble_detection:
    cluster_gap: 40
    pad_x: 15
    pad_y: 10
    flood_fill_tolerance: 15
    contour_expand: 5
  inpainting:
    enabled: true
    model: "lama"
    erode_px: 3
    text_pad: 24
    text_dilate: 6
    context_pad: 20
    max_tiles: 16
    max_tile_width: 1024
    max_tile_height: 1024
    max_tile_pixels: 1048576
    max_page_pixels: 40000000
    max_wall_seconds: 30
    min_host_available_mb: 512
    min_gpu_available_mb: 512
    seed: 0
    uniform_stddev: 8
    uniform_range: 28

worker:
  # PIPELINE_REVISION is supplied through the environment to both API and worker.
  redis_url: "redis://localhost:6379"
  consumer_group: "workers"
  heartbeat_interval: 30
  job_timeout: 300
  cache_dir: "./cache"
  result_ttl: 3600
  heartbeat_ttl: 60
  progress_ttl: 60
  high_burst_before_low: 3
