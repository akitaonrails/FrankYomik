services:
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
    ports:
      - "11434:11434"
    volumes:
      - ./server/models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen3:14b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # One-shot container that fixes shared-cache volume ownership before
  # the API or worker start.  Needed because distroless (API) has no chown.
  init-perms:
    image: busybox:latest@sha256:1487d0af5f52b4ba31c7e465126ee2123fe3f2305d638e7827681e7cf6c83d5e
    volumes:
      - ./cache:/data/cache
    command: ["sh", "-c", "chown -R ${APP_UID:-1026}:${APP_GID:-1026} /data/cache"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP_UID: ${APP_UID:-1026}
        APP_GID: ${APP_GID:-1026}
    user: "${APP_UID:-1026}:${APP_GID:-1026}"
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      AUTH_TOKEN: ${AUTH_TOKEN:?Set AUTH_TOKEN in .env or environment}
      CACHE_DIR: /data/cache
      PIPELINE_REVISION: ${PIPELINE_REVISION:-}
      ALLOW_LEGACY_PIPELINE_REVISION: ${ALLOW_LEGACY_PIPELINE_REVISION:-0}
    volumes:
      - ./cache:/data/cache
    depends_on:
      redis:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker-cpu
      args:
        APP_UID: ${APP_UID:-1026}
        APP_GID: ${APP_GID:-1026}
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      APP_UID: ${APP_UID:-1026}
      APP_GID: ${APP_GID:-1026}
      PIPELINE_REVISION: ${PIPELINE_REVISION:-}
      ALLOW_LEGACY_PIPELINE_REVISION: ${ALLOW_LEGACY_PIPELINE_REVISION:-0}
      MANGA_OCR_DEVICE: cpu
      TEXT_DETECTION_GPU: "false"
      EASYOCR_GPU: "false"
    command: ["--pipeline", "both", "--redis-url", "redis://redis:6379"]
    volumes:
      - ./cache:/app/server/cache
      - mangaocr-cache:/home/worker/.cache/manga_ocr
      - huggingface-cache:/home/worker/.cache/huggingface
      - easyocr-cache:/home/worker/.EasyOCR
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      init-perms:
        condition: service_completed_successfully
    restart: unless-stopped

  init-cloudflared:
    image: busybox:latest@sha256:1487d0af5f52b4ba31c7e465126ee2123fe3f2305d638e7827681e7cf6c83d5e
    volumes:
      - ./.cloudflared:/src:ro
      - cloudflared-config:/dest
    command: ["sh", "-c", "cp /src/* /dest/ && chmod 644 /dest/*"]
    restart: "no"

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    command: tunnel --config /etc/cloudflared/config.yml run yomik
    volumes:
      - cloudflared-config:/etc/cloudflared:ro
    depends_on:
      init-cloudflared:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
  mangaocr-cache:
  huggingface-cache:
  easyocr-cache:
  cloudflared-config:
